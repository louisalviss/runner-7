name: M88 All Outrights Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-outrights-all-publish.yml'
      - 'm88_outrights_capture.py'

permissions:
  contents: write

concurrency:
  group: m88-outrights-all-publisher-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Install collector dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v openvpn >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openvpn iproute2 iptables curl jq
          fi
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays

      - name: Select M88-compatible Asia relay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              for r in rs[:(8 if c=='TH' else 3)]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn')
                  p.write_text(cfg)
                  meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          if not meta:
              raise SystemExit('No Asia VPN Gate relays')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS='+str(len(meta)))
          PY

          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.249.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.249.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.249.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.249.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json
            sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error' /tmp/o.log 2>/dev/null && break || true
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json; then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except Exception:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                echo "$country $relay" | tee evidence/relay.txt
                selected=1
                break
              fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1

      - name: Capture exact M88 SABA Outright board
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 "$GITHUB_WORKSPACE/m88_outrights_capture.py"
          test -s evidence/m88-outrights-all.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/m88-outrights-all.json'))
          c=d.get('coverage') or {}
          ratio=float(c.get('capture_ratio') or 0)
          print('OUTRIGHT_COVERAGE',json.dumps(c,ensure_ascii=False))
          if ratio < .90:
              raise SystemExit(f'Production safety gate: {ratio:.2%} < 90%')
          PY

      - name: Publish last-good full Outright snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view m88-outrights-all --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create m88-outrights-all --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'M88 All Outrights' --notes 'Exact M88/SABA full-board Outright snapshot, refreshed automatically on Runner7.'
          fi
          gh release upload m88-outrights-all --repo "$GITHUB_REPOSITORY" \
            evidence/m88-outrights-all.json#M88-outrights-all.json \
            evidence/m88-outrights-health.json#M88-outrights-health.json \
            --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-outrights-all-${{ github.run_id }}
          path: evidence/
          retention-days: 3
