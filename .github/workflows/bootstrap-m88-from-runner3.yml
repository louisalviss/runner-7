# Runner7 migration bootstrap. PR trigger is used because connector-created pushes do not reliably start Actions.
name: Bootstrap M88 Pipeline From Runner3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-m88-from-runner3.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.runner7-bootstrap-trigger'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Copy current M88 capture core into Runner7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          BASE='https://raw.githubusercontent.com/louisalviss/runner-3/main'
          curl -LfsS --retry 3 "$BASE/m88_full_odds.py" -o m88_full_odds.py
          curl -LfsS --retry 3 "$BASE/render_m88_full.py" -o render_m88_full.py
          curl -LfsS --retry 3 "$BASE/build_m88_ai_database.py" -o build_m88_ai_database.py
          curl -LfsS --retry 3 "$BASE/.github/workflows/m88-live-publish.yml" -o .github/workflows/m88-live-publish.yml
          curl -LfsS --retry 3 "$BASE/.github/workflows/m88-outrights-all-publish.yml" -o .github/workflows/m88-outrights-all-publish.yml

          python3 - <<'PY'
          from pathlib import Path

          def add_pr_trigger(path, trigger):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              block=("  pull_request:\n"
                     "    types: [opened, synchronize, reopened]\n"
                     "    paths:\n"
                     f"      - '{trigger}'\n")
              if f"- '{trigger}'" not in s:
                  anchor="  workflow_dispatch:\n"
                  if anchor not in s: raise SystemExit(f'{path}: workflow_dispatch anchor missing')
                  s=s.replace(anchor, anchor+block, 1)
              p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/m88-live-publish.yml')
          s=p.read_text(encoding='utf-8')
          needle="      - 'render_m88_full.py'\n"
          if "'.m88-live-trigger'" not in s:
              if needle not in s: raise SystemExit('live workflow path anchor missing')
              s=s.replace(needle, needle+"      - '.m88-live-trigger'\n", 1)
          p.write_text(s,encoding='utf-8')
          add_pr_trigger(p, '.m88-live-trigger')

          p=Path('.github/workflows/m88-outrights-all-publish.yml')
          s=p.read_text(encoding='utf-8')
          needle="      - '.github/workflows/m88-outrights-all-publish.yml'\n"
          if "'.m88-outrights-trigger'" not in s:
              if needle not in s: raise SystemExit('outright workflow path anchor missing')
              s=s.replace(needle, needle+"      - '.m88-outrights-trigger'\n", 1)
          p.write_text(s,encoding='utf-8')
          add_pr_trigger(p, '.m88-outrights-trigger')
          PY

          python3 -m py_compile m88_full_odds.py render_m88_full.py build_m88_ai_database.py build_m88_ai_shards.py

      - name: Commit migrated core to the current branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add m88_full_odds.py render_m88_full.py build_m88_ai_database.py \
            .github/workflows/m88-live-publish.yml \
            .github/workflows/m88-outrights-all-publish.yml
          if git diff --cached --quiet; then
            echo 'M88 core already current'
          else
            git commit -m 'Migrate M88 capture pipeline to runner-7'
            TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
