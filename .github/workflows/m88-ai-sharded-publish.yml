name: Runner7 M88 AI Sharded Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-ai-sharded-publish.yml'
      - 'build_m88_ai_database.py'
      - 'build_m88_ai_shards.py'

permissions:
  contents: write

concurrency:
  group: runner7-m88-ai-sharded-publisher-v2
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact Runner7 M88 datasets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          gh api "repos/${GITHUB_REPOSITORY}/contents/data.json?ref=m88-live-data" --jq '.content' | tr -d '\n' | base64 -d > input/match-odds.json
          gh release download m88-outrights-all --repo "$GITHUB_REPOSITORY" --pattern 'm88-outrights-all.json' --dir input --clobber
          mv input/m88-outrights-all.json input/outrights.json
          test -s input/match-odds.json
          test -s input/outrights.json

      - name: Build master and AI shards
        shell: bash
        run: |
          set -euo pipefail
          python3 build_m88_ai_database.py --matches input/match-odds.json --outrights input/outrights.json --output out/ai-odds.json --health out/health.json
          python3 build_m88_ai_shards.py --input out/ai-odds.json --output-dir out
          test -s out/ai-odds.json
          test -s out/health.json
          test -s out/index.json
          test -s out/matches/live.json
          test -s out/matches/today.json
          test -s out/matches/early.json
          test -s out/outrights/index.json

      - name: Smoke test AI retrieval path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('out')
          db=json.loads((root/'ai-odds.json').read_text())
          assert db.get('schema_version') == 3 and db.get('operator') == 'M88' and db.get('canonical') is True
          assert int((db.get('index') or {}).get('match_count') or 0) >= 50
          assert int((db.get('index') or {}).get('outright_market_count') or 0) >= 40
          assert float((((db.get('freshness') or {}).get('outrights') or {}).get('capture_ratio') or 0)) >= .90
          nav=json.loads((root/'index.json').read_text())
          oi=json.loads((root/(nav['outrights']['index'])).read_text())
          epl=next(x for x in oi['competitions'] if x.get('slug')=='epl')
          shard=json.loads((root/epl['path']).read_text())
          winner=next((m for m in shard['markets'] if (m.get('market_name_guess') or '').strip().casefold()=='winner'),None)
          if winner is None:
              winner=next(m for m in shard['markets'] if str(m.get('title') or '').strip().casefold().endswith(' - winner'))
          arsenal=next(s for s in winner['selections'] if str(s.get('name') or '').strip().casefold()=='arsenal')
          assert arsenal.get('odds') is not None
          print(json.dumps({'smoke':'PASS','path':['index.json',nav['outrights']['index'],epl['path']],'market':winner.get('title'),'selection':'Arsenal','odds':arsenal['odds']},ensure_ascii=False))
          PY

      - name: Publish stable AI database branch
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER=$(git config --local --get http.https://github.com/.extraheader || true)
          rm -rf /tmp/m88-ai-pub
          git init -q /tmp/m88-ai-pub
          git -C /tmp/m88-ai-pub config user.name 'github-actions[bot]'
          git -C /tmp/m88-ai-pub config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/m88-ai-pub remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [ -z "$AUTH_HEADER" ] || git -C /tmp/m88-ai-pub config http.https://github.com/.extraheader "$AUTH_HEADER"
          git -C /tmp/m88-ai-pub checkout --orphan m88-ai-data >/dev/null 2>&1
          cp -R out/. /tmp/m88-ai-pub/
          printf '%s\n' '# Runner7 M88 AI Odds Database' '' 'Canonical: ai-odds.json' 'AI navigation: index.json' 'Outrights index: outrights/index.json' > /tmp/m88-ai-pub/README.md
          git -C /tmp/m88-ai-pub add .
          git -C /tmp/m88-ai-pub commit -q -m "Runner7 M88 AI database $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git -C /tmp/m88-ai-pub push -q --force origin HEAD:m88-ai-data

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner7-m88-ai-${{ github.run_id }}
          path: out/
          retention-days: 2