name: Runner7 M88 Pipeline Guardian

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-freshness-watchdog.yml'
  schedule:
    # Offset from the primary :02/:07/:12... publisher schedule.
    - cron: '4-59/5 * * * *'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: runner7-m88-pipeline-guardian-v3
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Guard freshness, recover missed runs, preserve last-good
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          ALERT_TITLE='[M88 AUTO] Odds pipeline degraded'
          HEALTH_URL="https://raw.githubusercontent.com/${REPO}/m88-ai-data/health.json"
          tmp=$(mktemp)

          find_alert_issue() {
            gh issue list --repo "$REPO" --state open --limit 100 \
              --json number,title \
              --jq '.[] | select(.title=="[M88 AUTO] Odds pipeline degraded") | .number' \
              | head -n1
          }

          open_alert() {
            reason="$1"
            issue=$(find_alert_issue || true)
            if [ -n "$issue" ]; then
              echo "ALERT_ALREADY_OPEN=$issue"
              return 0
            fi
            body=$(cat <<EOF
          Automatic Runner7 guardian alert.

          Reason: ${reason}

          Current canonical data remains on \`m88-ai-data\`. The recovery branch \`m88-ai-last-good\` is intentionally NOT advanced while the pipeline is unhealthy.

          Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )
            gh issue create --repo "$REPO" --title "$ALERT_TITLE" --body "$body" >/dev/null
            echo 'ALERT=OPENED'
          }

          close_alert_if_recovered() {
            issue=$(find_alert_issue || true)
            if [ -z "$issue" ]; then
              return 0
            fi
            gh issue comment "$issue" --repo "$REPO" \
              --body "Automatic recovery confirmed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Freshness/schema/coverage gates are healthy again; closing alert." >/dev/null
            gh issue close "$issue" --repo "$REPO" >/dev/null
            echo "ALERT=CLOSED_RECOVERED:$issue"
          }

          active_runs() {
            wf="$1"
            gh run list --repo "$REPO" --workflow "$wf" --limit 20 \
              --json status \
              --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length'
          }

          failure_streak() {
            wf="$1"
            gh run list --repo "$REPO" --workflow "$wf" --limit 5 \
              --json status,conclusion \
              --jq '.[] | select(.status=="completed") | (.conclusion // "")' \
            | python3 -c '
          import sys
          bad={"failure","cancelled","timed_out","action_required","startup_failure"}
          n=0
          for line in sys.stdin:
              c=line.strip()
              if c in bad:
                  n += 1
              else:
                  break
          print(n)
          '
          }

          trigger_if_idle() {
            wf="$1"
            label="$2"
            active=$(active_runs "$wf")
            echo "${label}_ACTIVE_RUNS=$active"
            if [ "$active" -eq 0 ]; then
              echo "${label}=TRIGGER_REFRESH"
              gh workflow run "$wf" --repo "$REPO"
            else
              echo "${label}=REFRESH_ALREADY_ACTIVE"
            fi
          }

          if ! curl -fsS --connect-timeout 8 --max-time 15 \
            -H 'Cache-Control: no-cache' \
            "${HEALTH_URL}?ts=$(date +%s)" -o "$tmp"; then
            open_alert 'health.json fetch failed'
            trigger_if_idle m88-live-ai-publish.yml MATCH
            exit 0
          fi

          read -r schema match_age outright_age ratio generated_at <<<"$(python3 - "$tmp" <<'PY'
          import json,sys
          from datetime import datetime, timezone

          d=json.load(open(sys.argv[1]))
          now=datetime.now(timezone.utc)
          def age(entry):
              ts=(entry or {}).get("captured_at")
              if not ts:
                  return 999999
              dt=datetime.fromisoformat(str(ts).replace("Z","+00:00"))
              if dt.tzinfo is None:
                  dt=dt.replace(tzinfo=timezone.utc)
              return max(0,int((now-dt.astimezone(timezone.utc)).total_seconds()))
          f=d.get("freshness") or {}
          m=f.get("match_odds") or {}
          o=f.get("outrights") or {}
          print(
              d.get("schema_version",0),
              age(m),
              age(o),
              float(o.get("capture_ratio") or 0),
              d.get("generated_at_utc") or "unknown"
          )
          PY
          )"

          echo "SCHEMA_VERSION=$schema"
          echo "MATCH_AGE_SECONDS=$match_age"
          echo "OUTRIGHT_AGE_SECONDS=$outright_age"
          echo "OUTRIGHT_CAPTURE_RATIO=$ratio"
          echo "HEALTH_GENERATED_AT=$generated_at"

          # Recover cadence misses first. A single failed workflow run is not
          # itself a production incident while the published dataset is usable.
          if [ "$match_age" -gt 420 ]; then
            trigger_if_idle m88-live-ai-publish.yml MATCH
          fi
          if [ "$outright_age" -gt 1200 ]; then
            trigger_if_idle m88-outrights-all-publish.yml OUTRIGHT
          fi

          match_active=$(active_runs m88-live-ai-publish.yml)
          outright_active=$(active_runs m88-outrights-all-publish.yml)
          match_failures=$(failure_streak m88-live-ai-publish.yml)
          outright_failures=$(failure_streak m88-outrights-all-publish.yml)

          echo "MATCH_ACTIVE_RUNS=$match_active"
          echo "OUTRIGHT_ACTIVE_RUNS=$outright_active"
          echo "MATCH_FAILURE_STREAK=$match_failures"
          echo "OUTRIGHT_FAILURE_STREAK=$outright_failures"

          reasons=()
          [ "$schema" = '3' ] || reasons+=("schema_version=${schema}, expected 3")
          [ "$match_age" -le 1200 ] || reasons+=("match odds stale: ${match_age}s > 1200s")
          [ "$outright_age" -le 2700 ] || reasons+=("outrights stale: ${outright_age}s > 2700s")
          python3 - "$ratio" <<'PY' || reasons+=("outright capture ratio ${ratio} < 0.90")
          import sys
          raise SystemExit(0 if float(sys.argv[1]) >= .90 else 1)
          PY

          # Escalate workflow failures only when repeated and no recovery is active.
          if [ "$match_failures" -ge 2 ] && [ "$match_age" -gt 420 ] && [ "$match_active" -eq 0 ]; then
            reasons+=("match publisher failed ${match_failures} consecutive completed runs")
          fi
          if [ "$outright_failures" -ge 2 ] && [ "$outright_age" -gt 1200 ] && [ "$outright_active" -eq 0 ]; then
            reasons+=("outright publisher failed ${outright_failures} consecutive completed runs")
          fi

          if [ "${#reasons[@]}" -gt 0 ]; then
            joined=$(IFS='; '; echo "${reasons[*]}")
            echo "GUARDIAN=DEGRADED: $joined"
            open_alert "$joined"
            exit 0
          fi

          good_sha=$(gh api "repos/${REPO}/branches/m88-ai-data" --jq '.commit.sha')
          if gh api "repos/${REPO}/git/ref/heads/m88-ai-last-good" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/m88-ai-last-good" \
              -f sha="$good_sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref='refs/heads/m88-ai-last-good' -f sha="$good_sha" >/dev/null
          fi
          echo "LAST_GOOD_SHA=$good_sha"
          echo 'GUARDIAN=HEALTHY'
          close_alert_if_recovered
