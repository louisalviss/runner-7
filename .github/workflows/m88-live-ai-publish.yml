name: Runner7 M88 Live + AI Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-live-ai-publish.yml'
      - 'm88_full_odds.py'
      - 'build_m88_ai_database.py'
      - 'build_m88_ai_shards.py'
  schedule:
    # Avoid the busiest top-of-5-minute scheduler boundary.
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: runner7-m88-live-ai-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Install VPN tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v openvpn >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openvpn iproute2 iptables curl
          fi

      - name: Build Asia relay pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence publish ai-input ai-out /tmp/m88-relays
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','MY','PH','ID','JP','KR','TW','VN']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          picked=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              picked.extend((c,r) for r in rs[:3])
          if not picked:
              raise SystemExit('No Asia VPN Gate relay')
          meta=[]
          for i,(c,r) in enumerate(picked):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/m88-relays/{i:02d}-{c}.ovpn')
              p.write_text(cfg)
              meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/m88-relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS='+str(len(meta)))
          PY

      - name: Connect first M88-compatible relay
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.236.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.236.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.236.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.236.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          connected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log /tmp/m88-probe.json
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error' /tmp/openvpn.log 2>/dev/null && break || true
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 15 \
              'https://msports.m88.com/api/v1/sport/top?currency=VND' \
              -H 'Authorization: Bearer GUEST' -o /tmp/m88-probe.json; then
              if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/m88-probe.json'))
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                echo "SELECTED $country $relay"
                connected=1
                break
              fi
            fi
          done < /tmp/m88-relays.tsv
          test "$connected" = 1

      - name: Fetch exact M88 match markets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          common={'sport_id':'10','lang_id':'en','view_type':'0','leagues':'999','odds_type':'3','odds_group':'3','view_date':'0','time_filter':'0','category':'0','branch_code':'','currency':'VND','is_full':'true','prev_params':'','version':'','top_x':0,'is_stream':'false','is_live_center':'false','currentMenu':'spesificSport','prevMenu':'','method':'LoadOddsData'}
          for scope,slot in [('live','1'),('today','2'),('early','3')]:
              for group in [1,2,4,5,6,7,8]:
                  p=dict(common)
                  p['currentTimeSlot']=slot
                  p['display_type']=f'{group}{slot}'
                  if slot=='3': p['view_date']='1'
                  pathlib.Path(f'/tmp/{scope}_g{group}.req').write_text(json.dumps(p,separators=(',',':')))
          PY

          fetch_group() {
            scope="$1"; group="$2"
            if [ "$group" = 1 ]; then out="evidence/${scope}.json"; else out="evidence/${scope}_g${group}.json"; fi
            tmp="${out}.tmp"
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 35 --retry 1 --retry-delay 1 --retry-all-errors \
              -X POST 'https://msports.m88.com/api/v1/m88/data/main' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Content-Type: application/json' \
              -H 'Authorization: Bearer GUEST' \
              --data-binary @"/tmp/${scope}_g${group}.req" -o "$tmp"; then
              if python3 - "$tmp" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              raise SystemExit(0 if d.get('status')==1 else 1)
          except Exception:
              raise SystemExit(1)
          PY
              then
                mv "$tmp" "$out"
                echo "FETCH ${scope} g${group}=OK"
                return 0
              fi
            fi
            rm -f "$tmp"
            echo "FETCH ${scope} g${group}=MISS"
            return 1
          }

          fetch_scope() {
            scope="$1"
            fetch_group "$scope" 1 || return 1
            for g in 2 4 5 6 7 8; do
              fetch_group "$scope" "$g" || rm -f "evidence/${scope}_g${g}.json"
            done
          }

          fetch_scope live || echo 'LIVE_EMPTY_OR_UNAVAILABLE'
          fetch_scope today || echo 'TODAY_OPTIONAL_MISS'
          fetch_scope early || echo 'EARLY_OPTIONAL_MISS'

          python3 m88_full_odds.py \
            --input-dir evidence \
            --output-json publish/data.json \
            --output-csv publish/odds.csv \
            --odds-format decimal

          python3 - <<'PY'
          import json,pathlib,re
          p=pathlib.Path('publish/data.json')
          d=json.loads(p.read_text())
          matches=d.get('matches',[])
          def virtual(m):
              text=' '.join([(m.get('league') or {}).get('name',''),m.get('home',''),m.get('away','')])
              return bool(re.search(r'virtual|esoccer|e-soccer|pes\s?\d|simulated|cyber|\(v\)',text,re.I))
          real=[m for m in matches if not virtual(m)]
          by_scope={s:sum(1 for m in real if m.get('scope')==s) for s in ('live','today','early')}
          sels=(d.get('counts') or {}).get('total_selections',0)
          if len(real) < 10 or sels < 50:
              raise SystemExit(f'Unsafe snapshot real_matches={len(real)} selections={sels}')
          d['live_generated_at']=d.get('generated_at') or d.get('captured_at')
          d['source_mode']='direct_m88_guest_full_market_groups'
          d['exact_operator_odds']=True
          d['source_provenance']='direct_m88_msports_guest'
          d['real_match_counts']=by_scope
          p.write_text(json.dumps(d,separators=(',',':'),ensure_ascii=False))
          print('REAL_MATCHES='+str(len(real)))
          print('REAL_BY_SCOPE='+json.dumps(by_scope))
          print('FULL_SELECTIONS='+str(sels))
          PY

      - name: Publish match snapshot and AI shards atomically in the same runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER=$(git config --local --get http.https://github.com/.extraheader || true)

          rm -rf /tmp/m88-live-pub
          git init -q /tmp/m88-live-pub
          git -C /tmp/m88-live-pub config user.name 'github-actions[bot]'
          git -C /tmp/m88-live-pub config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/m88-live-pub remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [ -z "$AUTH_HEADER" ] || git -C /tmp/m88-live-pub config http.https://github.com/.extraheader "$AUTH_HEADER"
          git -C /tmp/m88-live-pub checkout --orphan m88-live-data >/dev/null 2>&1
          cp publish/data.json publish/odds.csv /tmp/m88-live-pub/
          printf '%s\n' 'M88 exact match odds. Runner7 combined live+AI publisher.' > /tmp/m88-live-pub/README.md
          git -C /tmp/m88-live-pub add .
          git -C /tmp/m88-live-pub commit -q -m "M88 sports odds $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git -C /tmp/m88-live-pub push -q --force origin HEAD:m88-live-data

          cp publish/data.json ai-input/match-odds.json
          gh release download m88-outrights-all \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'm88-outrights-all.json' \
            --dir ai-input \
            --clobber
          mv ai-input/m88-outrights-all.json ai-input/outrights.json

          python3 build_m88_ai_database.py \
            --matches ai-input/match-odds.json \
            --outrights ai-input/outrights.json \
            --output ai-out/ai-odds.json \
            --health ai-out/health.json
          python3 build_m88_ai_shards.py --input ai-out/ai-odds.json --output-dir ai-out

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('ai-out')
          db=json.loads((root/'ai-odds.json').read_text())
          assert db.get('schema_version')==3
          assert db.get('operator')=='M88'
          assert int((db.get('index') or {}).get('match_count') or 0) >= 50
          assert int((db.get('index') or {}).get('outright_market_count') or 0) >= 40
          assert float((((db.get('freshness') or {}).get('outrights') or {}).get('capture_ratio') or 0)) >= .90
          nav=json.loads((root/'index.json').read_text())
          oi=json.loads((root/nav['outrights']['index']).read_text())
          epl=next(x for x in oi['competitions'] if x.get('slug')=='epl')
          shard=json.loads((root/epl['path']).read_text())
          winner=next((m for m in shard['markets'] if (m.get('market_name_guess') or '').strip().casefold()=='winner'),None)
          if winner is None:
              winner=next(m for m in shard['markets'] if str(m.get('title') or '').strip().casefold().endswith(' - winner'))
          arsenal=next(s for s in winner['selections'] if str(s.get('name') or '').strip().casefold()=='arsenal')
          assert arsenal.get('odds') is not None
          print(json.dumps({'smoke':'PASS','market':winner.get('title'),'selection':'Arsenal','odds':arsenal.get('odds')},ensure_ascii=False))
          PY

          rm -rf /tmp/m88-ai-pub
          git init -q /tmp/m88-ai-pub
          git -C /tmp/m88-ai-pub config user.name 'github-actions[bot]'
          git -C /tmp/m88-ai-pub config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/m88-ai-pub remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [ -z "$AUTH_HEADER" ] || git -C /tmp/m88-ai-pub config http.https://github.com/.extraheader "$AUTH_HEADER"
          git -C /tmp/m88-ai-pub checkout --orphan m88-ai-data >/dev/null 2>&1
          cp -R ai-out/. /tmp/m88-ai-pub/
          printf '%s\n' '# Runner7 M88 AI Odds Database' '' 'AI navigation: index.json' 'Canonical master: ai-odds.json' > /tmp/m88-ai-pub/README.md
          git -C /tmp/m88-ai-pub add .
          git -C /tmp/m88-ai-pub commit -q -m "Runner7 M88 AI database $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git -C /tmp/m88-ai-pub push -q --force origin HEAD:m88-ai-data

          echo 'RUNNER7_M88_END_TO_END=PASS'
