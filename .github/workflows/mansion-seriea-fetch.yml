name: Mansionbet Serie A Fetch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q beautifulsoup4 lxml

      - name: Build relay pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mansion-relays
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','JP','KR','VN','MY','PH','ID','TW']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          out=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              for r in rs[:3]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/mansion-relays/{len(out):02d}-{c}.ovpn')
                  p.write_text(cfg)
                  out.append((str(p),c,r.get('IP','')))
          if not out: raise SystemExit('No VPN relays')
          pathlib.Path('/tmp/mansion-relays.tsv').write_text('\n'.join('\t'.join(x) for x in out)+'\n')
          print('RELAYS',len(out))
          PY

      - name: Rotate IP and fetch page
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://www.mansionbet.com/vn/serie-a/'
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.236.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.236.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.236.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.236.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          success=0
          : > /tmp/attempts.tsv
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY country=$country relay=$relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log /tmp/page.html
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error' /tmp/openvpn.log 2>/dev/null && break || true
            done
            if [ "$ok" != 1 ]; then
              printf '%s\t%s\tVPN_FAIL\n' "$country" "$relay" >> /tmp/attempts.tsv
              continue
            fi
            exitip=$(sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 12 https://api.ipify.org || true)
            code=$(sudo ip netns exec vpnns curl -L --compressed --connect-timeout 10 --max-time 40 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
              -H 'Accept-Language: vi-VN,vi;q=0.9,en-US;q=0.8,en;q=0.7' \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -o /tmp/page.html -w '%{http_code}' "$TARGET" || true)
            bytes=$(wc -c < /tmp/page.html 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\t%s\t%s\n' "$country" "$relay" "$exitip" "$code" "$bytes" >> /tmp/attempts.tsv
            echo "RESULT country=$country exit_ip=$exitip http=$code bytes=$bytes"
            if [ "$code" = '200' ] && [ "$bytes" -ge 30000 ] && ! grep -Eqi 'access denied|forbidden|checking your browser|just a moment|captcha' /tmp/page.html; then
              echo "$country" > /tmp/selected-country
              echo "$relay" > /tmp/selected-relay
              echo "$exitip" > /tmp/selected-exit-ip
              success=1
              break
            fi
          done < /tmp/mansion-relays.tsv
          echo '--- ATTEMPTS ---'
          cat /tmp/attempts.tsv
          test "$success" = 1

      - name: Extract article structure and text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from bs4 import BeautifulSoup, Tag
          import json,re,pathlib
          html=pathlib.Path('/tmp/page.html').read_text(encoding='utf-8',errors='replace')
          soup=BeautifulSoup(html,'lxml')
          for x in soup(['script','style','noscript','svg']): x.decompose()
          candidates=[
              soup.select_one('article'),
              soup.select_one('.entry-content'),
              soup.select_one('.post-content'),
              soup.select_one('.article-content'),
              soup.select_one('main'),
          ]
          root=next((x for x in candidates if x and len(x.get_text(' ',strip=True))>1000),soup.body or soup)
          print('BEGIN_MANSION_META')
          print(json.dumps({
              'title': soup.title.get_text(' ',strip=True) if soup.title else None,
              'h1': [x.get_text(' ',strip=True) for x in soup.find_all('h1')],
              'selected_country': pathlib.Path('/tmp/selected-country').read_text().strip() if pathlib.Path('/tmp/selected-country').exists() else None,
              'selected_relay': pathlib.Path('/tmp/selected-relay').read_text().strip() if pathlib.Path('/tmp/selected-relay').exists() else None,
              'exit_ip': pathlib.Path('/tmp/selected-exit-ip').read_text().strip() if pathlib.Path('/tmp/selected-exit-ip').exists() else None,
              'html_bytes': len(html.encode()),
              'root_tag': root.name,
              'root_class': root.get('class') if isinstance(root,Tag) else None,
          },ensure_ascii=False))
          print('END_MANSION_META')
          print('BEGIN_MANSION_EXTRACT')
          seen=set()
          for el in root.find_all(['h1','h2','h3','h4','h5','h6','p','ul','ol','table']):
              if any(p.name in ['table','ul','ol'] for p in el.parents if p is not root):
                  continue
              if el.name in ['h1','h2','h3','h4','h5','h6']:
                  t=' '.join(el.stripped_strings)
                  if t: print(f'[{el.name.upper()}] {t}')
              elif el.name=='p':
                  t=' '.join(el.stripped_strings)
                  if t and t not in seen:
                      seen.add(t); print(f'[P] {t}')
              elif el.name in ['ul','ol']:
                  for li in el.find_all('li',recursive=False):
                      t=' '.join(li.stripped_strings)
                      if t: print(f'[LI] {t}')
              elif el.name=='table':
                  print('[TABLE]')
                  for tr in el.find_all('tr'):
                      cells=[' '.join(c.stripped_strings) for c in tr.find_all(['th','td'])]
                      if cells: print(' | '.join(cells))
                  print('[/TABLE]')
          print('END_MANSION_EXTRACT')
          PY
