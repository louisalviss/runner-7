name: WR FX Research

on:
  push:
    branches:
      - research/wr-fx-20260820
    paths:
      - '.github/workflows/wr-fx-research.yml'
      - 'research/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wr-fx-research.yml'
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe public M5 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fx
          for s in EURUSD GBPUSD AUDUSD NZDUSD; do
            u="https://raw.githubusercontent.com/jaxontn/historical-Data/main/${s}_M5.csv"
            echo "=== $s ==="
            curl -fL --retry 3 "$u" -o "/tmp/fx/${s}.csv"
            echo "BYTES=$(wc -c < /tmp/fx/${s}.csv) LINES=$(wc -l < /tmp/fx/${s}.csv)"
            echo "HEAD"
            head -n 3 "/tmp/fx/${s}.csv"
            echo "TAIL"
            tail -n 3 "/tmp/fx/${s}.csv"
          done
