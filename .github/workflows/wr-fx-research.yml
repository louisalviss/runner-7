name: WR FX Research

on:
  push:
    branches:
      - research/wr-fx-20260820
    paths:
      - '.github/workflows/wr-fx-research.yml'
      - 'research/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wr-fx-research.yml'
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe HistData M1
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/TghMonster/ForexDatasetDownloader.git /tmp/marketdl
          pip install -q -e /tmp/marketdl
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from marketdl.providers.histdata import HistDataProvider
          out=Path('/tmp/hist')
          p=HistDataProvider(platform='ASCII', timeout=45, max_retries=2)
          for sym,year,month in [('EURUSD',2025,1),('USDJPY',2025,1),('XAUUSD',2025,1)]:
              print(f'=== {sym} {year}-{month:02d} ===')
              zpath=p.download_month(sym,year,month,timeframe='M1',output_dir=out)
              print('ZIP',zpath,zpath.stat().st_size)
              with zipfile.ZipFile(zpath) as z:
                  print('FILES',[(i.filename,i.file_size) for i in z.infolist()])
                  name=z.namelist()[0]
                  with z.open(name) as f:
                      first=[]; last=[]; n=0
                      for raw in f:
                          line=raw.decode(errors='replace').strip()
                          if not line: continue
                          n+=1
                          if len(first)<2: first.append(line)
                          last=(last+[line])[-2:]
                      print('ROWS',n)
                      print('FIRST',first)
                      print('LAST',last)
          PY
