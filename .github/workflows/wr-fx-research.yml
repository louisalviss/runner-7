name: WR FX Research

on:
  push:
    branches:
      - research/wr-fx-20260820
    paths:
      - '.github/workflows/wr-fx-research.yml'
      - 'research/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wr-fx-research.yml'
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HistData downloader
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/TghMonster/ForexDatasetDownloader.git /tmp/marketdl
          pip install -q -e /tmp/marketdl
      - name: Run WR FX/Gold 2022-2026
        shell: bash
        run: |
          set -euo pipefail
          python research/wr_fx_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-fx-results
          path: /tmp/wr-fx-out
          retention-days: 7
